name: 🌳 AST · Cloudflare AST Explorer

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ast-cloudflare-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name != 'pull_request' || github.event.action != 'closed')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Install pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.21.0 --activate
          pnpm --version
      - run: pnpm install --frozen-lockfile
      # Deployment is not blocked by repository lint findings.
      - run: pnpm typecheck && pnpm generate
      - name: Verify static assets
        run: |
          test -f .output/public/index.html
          test -f .output/public/_headers
          grep -q 'Cross-Origin-Embedder-Policy: require-corp' .output/public/_headers
          grep -q 'Cross-Origin-Opener-Policy: same-origin' .output/public/_headers
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_ZONE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub Actions secret::$name must be configured for this repository"
              exit 1
            fi
          done
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AST_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          WORKER_NAME=ast-explorer
          if [ -n "$AST_PR_NUMBER" ]; then
            WORKER_NAME="ast-pr-$AST_PR_NUMBER"
          fi
          wrangler deploy --name "$WORKER_NAME"
      - name: Attach domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          AST_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/cloudflare-domain.mjs deploy

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AST_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/cloudflare-domain.mjs cleanup
