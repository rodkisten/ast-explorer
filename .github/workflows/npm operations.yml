name: 🥊 Package & Shell Operations

run-name: "🥊 ${{ inputs.operation }}${{ inputs.custom-command-order != 'none' && inputs.operation != 'custom' && format(' (+shell {0})', inputs.custom-command-order) || '' }} on 🌿 ${{ inputs.selected-branch || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      selected-branch:
        description: 'Target branch'
        type: string
        default: 'main'
        required: false
      operation:
        description: 'Operation to execute'
        required: true
        default: 'install'
        type: choice
        options:
          - install
          - add
          - update
          - uninstall
          - custom
      packages:
        description: 'Package list (supports chained commands, e.g. "pnpm add zod && pnpm add -D @types/node")'
        type: string
        required: false
        default: ''
      custom-command:
        description: 'Any shell command (used in "custom" mode or when order is before/after)'
        type: string
        required: false
        default: ''
      custom-command-order:
        description: 'When to run custom-command relative to package operation'
        type: choice
        required: false
        default: 'none'
        options:
          - none
          - before
          - after

permissions:
  contents: write

concurrency:
  group: pkg-operations-${{ inputs.selected-branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  execute:
    name: 🥊 ${{ inputs.operation }} (${{ inputs.selected-branch || github.ref_name }})
    outputs:
      changed: ${{ steps.generated_output.outputs.changed }}
      branch: ${{ steps.generated_output.outputs.branch }}
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Authenticate Rod GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID || vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.selected-branch || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: 🪵 Verify branch and synchronize
        if: (inputs.selected-branch || github.ref_name) != 'main'
        shell: bash
        env:
          BRANCH: ${{ inputs.selected-branch || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"

      - name: 🔍 Detect package manager (npm or pnpm)
        id: detect-pm
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "pnpm-lock.yaml" ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "📦 Detected: pnpm (pnpm-lock.yaml found)"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "📦 Detected: npm"
          fi

      - name: 📦 Setup pnpm (auto)
        if: steps.detect-pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: ${{ steps.detect-pm.outputs.pm }}

      - name: 🥊 Run ${{ inputs.operation }}
        id: run-op
        shell: bash
        env:
          PM: ${{ steps.detect-pm.outputs.pm }}
          OP: ${{ inputs.operation }}
          PKGS: ${{ inputs.packages }}
          CMD: ${{ inputs.custom-command }}
          CMD_ORDER: ${{ inputs.custom-command-order }}
        run: |
          set -euo pipefail

          # 1. Modo exclusivamente Custom
          if [ "$OP" = "custom" ]; then
            if [ -z "$CMD" ]; then
              echo "❌ Error: 'custom-command' is required when operation is 'custom'."
              exit 1
            fi
            [ -n "$PKGS" ] && echo "⚠️ Warning: 'packages' input is ignored in 'custom' mode."
            echo "cleaned_pkgs=N/A (custom)" >> "$GITHUB_OUTPUT"
            echo "🥊 Executing custom shell command: $CMD"
            eval "$CMD"
            exit 0
          fi

          # 2. Validação do custom-command-order em operações de pacote
          if [ "$CMD_ORDER" != "none" ] && [ -z "$CMD" ]; then
            echo "❌ Error: 'custom-command' cannot be empty when 'custom-command-order' is set to '$CMD_ORDER'."
            exit 1
          fi

          if [ "$CMD_ORDER" = "none" ] && [ -n "$CMD" ]; then
            echo "⚠️ Warning: 'custom-command' is ignored because 'custom-command-order' is 'none'."
          fi

          # 3. Executa custom-command ANTES (se selecionado)
          if [ "$CMD_ORDER" = "before" ]; then
            echo "⏮️ Executing custom shell command BEFORE '$OP': $CMD"
            eval "$CMD"
          fi

          # 4. Normaliza travessões (—dev ou –dev -> --dev), barras invertidas (\) e separadores (&& ou ;) em quebras de linha
          CLEANED_COMMANDS=$(printf '%s\n' "$PKGS" | sed -E '
            s/[—–]/--/g;
            s/\\/\n/g;
            s/(&&|;)/\n/g;
          ' | sed -E '
            s/^[[:space:]]*(pnpm|npm|yarn|bun)[[:space:]]+(add|install|i|remove|uninstall|rm|update|up)[[:space:]]+//;
            s/^[[:space:]]+|[[:space:]]+$//g;
          ' | sed '/^$/d')

          # Salva uma versão em linha única para exibir no Summary
          SUMMARY_PKGS=$(echo "$CLEANED_COMMANDS" | paste -sd " | " -)
          echo "cleaned_pkgs=${SUMMARY_PKGS:-none}" >> "$GITHUB_OUTPUT"

          # Explicit packages must be saved to the manifest even in install mode.
          EFFECTIVE_OP="$OP"
          if [ "$OP" = "install" ] && [ -n "$CLEANED_COMMANDS" ]; then
            EFFECTIVE_OP=add
            echo "📦 Explicit packages detected: switching install to add"
          fi

          # Validação da lista de pacotes para add e uninstall
          if [ "$OP" = "add" ] || [ "$OP" = "uninstall" ]; then
            if [ -z "$CLEANED_COMMANDS" ]; then
              echo "❌ Error: 'packages' list is required for '$OP' operation."
              exit 1
            fi
          fi

          # 5. Executa operação de pacotes (sem pacotes explícitos)
          if [ -z "$CLEANED_COMMANDS" ]; then
            if [ "$PM" = "pnpm" ]; then
              if [ "$OP" = "install" ]; then
                pnpm install --frozen-lockfile
              else
                pnpm "$OP"
              fi
            else
              if [ "$OP" = "install" ]; then
                npm ci --legacy-peer-deps --no-audit --no-fund
              else
                npm "$OP" --legacy-peer-deps --no-audit --no-fund
              fi
            fi
          # Executa cada linha/bloco de pacotes limpo separadamente
          else
            while IFS= read -r LINE; do
              [ -z "$LINE" ] && continue
              echo "📦 Running $PM $OP $LINE"
              if [ "$PM" = "pnpm" ]; then
                pnpm "$EFFECTIVE_OP" $LINE
              else
                if [ "$EFFECTIVE_OP" = "add" ]; then
                  npm install $LINE --legacy-peer-deps --no-audit --no-fund
                elif [ "$EFFECTIVE_OP" = "uninstall" ]; then
                  npm uninstall $LINE --legacy-peer-deps --no-audit --no-fund
                else
                  npm update $LINE --legacy-peer-deps --no-audit --no-fund
                fi
              fi
            done <<< "$CLEANED_COMMANDS"
          fi

          # 6. Executa custom-command DEPOIS (se selecionado)
          if [ "$CMD_ORDER" = "after" ]; then
            echo "⏭️ Executing custom shell command AFTER '$OP': $CMD"
            eval "$CMD"
          fi

      - name: 💾 Commit changes
        id: generated_output
        shell: bash
        env:
          BRANCH: ${{ inputs.selected-branch || github.ref_name }}
          PM: ${{ steps.detect-pm.outputs.pm }}
          OP: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

          for file in package.json pnpm-lock.yaml package-lock.json; do
            if [ -f "$file" ]; then
              git add -- "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No package manifest or lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore(deps): run $OP ($PM) [deploy]"
          git push origin "HEAD:$BRANCH"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 📊 Generate Job Summary
        if: always()
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ inputs.selected-branch || github.ref_name }}
          PM: ${{ steps.detect-pm.outputs.pm || 'N/A' }}
          OP: ${{ inputs.operation }}
          RAW_PKGS: ${{ inputs.packages }}
          CLEANED_PKGS: ${{ steps.run-op.outputs.cleaned_pkgs || 'none' }}
          CUSTOM_CMD: ${{ inputs.custom-command }}
          CMD_ORDER: ${{ inputs.custom-command-order }}
          CHANGED: ${{ steps.generated_output.outputs.changed || 'false' }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const { BRANCH, PM, OP, RAW_PKGS, CLEANED_PKGS, CUSTOM_CMD, CMD_ORDER, CHANGED, JOB_STATUS } = process.env;
            const isSuccess = JOB_STATUS === 'success';

            const rows = [
              [
                { data: 'Parâmetro', header: true },
                { data: 'Valor', header: true }
              ],
              ['🌿 Branch', `<code>${BRANCH}</code>`],
              ['📦 Package Manager', `<code>${PM}</code>`],
              ['⚙️ Operação', `<code>${OP}</code>`]
            ];

            if (OP === 'custom') {
              rows.push(['💻 Comando Custom', `<code>${CUSTOM_CMD}</code>`]);
            } else {
              rows.push(['📋 Pacotes / Flags', `<code>${CLEANED_PKGS}</code>`]);
              if (CMD_ORDER !== 'none' && CUSTOM_CMD) {
                const timingLabel = CMD_ORDER === 'before' ? '⏮️ Antes (before)' : '⏭️ Depois (after)';
                rows.push([`💻 Shell (${timingLabel})`, `<code>${CUSTOM_CMD}</code>`]);
              }
            }

            rows.push(['💾 Alterações Commitadas', CHANGED === 'true' ? '✅ Sim (push realizado)' : '➖ Nenhuma alteração']);

            const summary = core.summary
              .addHeading(`🥊 Package & Shell Operations — ${isSuccess ? 'Sucesso ✅' : 'Falha ❌'}`, 2)
              .addTable(rows);

            if (OP !== 'custom' && RAW_PKGS && RAW_PKGS.trim() !== CLEANED_PKGS) {
              summary.addQuote(
                `Input sanitizado automaticamente: "${RAW_PKGS.replace(/\n/g, ' ')}" → "${CLEANED_PKGS}"`,
                'Auto-Sanitizer'
              );
            }

            await summary.write();
